  @keyframes gb-lid { 0%{transform:translateY(0) rotate(0deg); opacity:1} 100%{transform:translateY(-190px) rotate(-38deg); opacity:0} }
  @keyframes gb-boxfade { 0%{transform:scale(1)} 30%{transform:scale(1.16)} 100%{transform:scale(0.84); opacity:0} }
  @keyframes gb-pop { 0%{transform:scale(0.6); opacity:1} 60%{transform:scale(1.6); opacity:0.9} 100%{transform:scale(2.2); opacity:0} }
  @keyframes gb-fly { 0%{transform:translate(0,0) scale(0.3) rotate(0deg); opacity:0} 15%{opacity:1} 100%{transform:translate(var(--tx,0px), var(--ty,0px)) scale(1) rotate(240deg); opacity:0} }
  @keyframes gb-text { 0%{transform:scale(0.5) rotate(-6deg); opacity:0} 55%{transform:scale(1.16) rotate(2deg); opacity:1} 100%{transform:scale(1) rotate(0); opacity:1} }
  @keyframes cat-dance { 0%{transform:translateY(0) rotate(-6deg)} 25%{transform:translateY(-14px) rotate(3deg)} 50%{transform:translateY(0) rotate(6deg)} 75%{transform:translateY(-14px) rotate(-3deg)} 100%{transform:translateY(0) rotate(-6deg)} }
  @keyframes note-float { 0%{transform:translateY(20px) rotate(-10deg); opacity:0} 25%{opacity:1} 100%{transform:translateY(-110px) rotate(16deg); opacity:0} }
</style>

<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { step: 'form', text: '', saved: '', phase: 'box', link: '', copied: false };

  componentDidMount() {
    const m = /[#&?]g=([^&]+)/.exec(location.hash || '');
    if (!m) return;
    try {
      const msg = decodeURIComponent(atob(decodeURIComponent(m[1])));
      if (msg) this.setState({ step: 'gift', saved: msg, phase: 'box' });
    } catch (e) {}
  }

  // one video, green-keyed into an offscreen canvas, blitted to every cat canvas
  catsRef = el => {
    if (this._wrap === el) return;
    this._wrap = el;
    if (!el) { cancelAnimationFrame(this._raf); if (this._vid) this._vid.pause(); return; }
    const targets = Array.from(el.querySelectorAll('canvas'));
    if (!targets.length) return;
    const v = this._vid || (this._vid = Object.assign(document.createElement('video'), {
      src: './cat-dance.mp4', loop: true, muted: true, playsInline: true, autoplay: true
    }));
    v.muted = true;
    v.play().catch(() => {});
    const W = 420, H = 470;
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const ctx = off.getContext('2d', { willReadFrequently: true });

    const findCrop = () => {
      const vw = v.videoWidth, vh = v.videoHeight;
      const cw = 120, ch = Math.max(1, Math.round(vh * (120 / vw)));
      const oc = document.createElement('canvas');
      oc.width = cw; oc.height = ch;
      const octx = oc.getContext('2d', { willReadFrequently: true });
      octx.drawImage(v, 0, 0, cw, ch);
      const q = octx.getImageData(0, 0, cw, ch).data;
      let x0 = cw, y0 = ch, x1 = -1, y1 = -1;
      for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) {
        const k = (j * cw + i) * 4;
        if (q[k + 1] - Math.max(q[k], q[k + 2]) > 40) continue;
        if (i < x0) x0 = i;
        if (i > x1) x1 = i;
        if (j < y0) y0 = j;
        if (j > y1) y1 = j;
      }
      if (x1 < 0) return null;
      const sc = vw / cw, pad = 6;
      const sx = Math.max(0, (x0 - pad) * sc), sy = Math.max(0, (y0 - pad) * sc);
      const sw = Math.min(vw - sx, (x1 - x0 + 1 + pad * 2) * sc);
      const sh = Math.min(vh - sy, (y1 - y0 + 1 + pad * 2) * sc);
      return sw > 8 && sh > 8 ? { sx, sy, sw, sh } : null;
    };

    const draw = () => {
      this._raf = requestAnimationFrame(draw);
      if (!v.videoWidth || v.readyState < 2) return;
      if (!this._crop) this._crop = findCrop() || { sx: 0, sy: 0, sw: v.videoWidth, sh: v.videoHeight };
      const c0 = this._crop;
      const s = Math.min(W / c0.sw, H / c0.sh);
      const w = c0.sw * s, h = c0.sh * s;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(v, c0.sx, c0.sy, c0.sw, c0.sh, (W - w) / 2, H - h, w, h);
      const d = ctx.getImageData(0, 0, W, H), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        if (!p[i + 3]) continue;
        const r = p[i], g = p[i + 1], b = p[i + 2];
        const spill = g - Math.max(r, b);
        if (spill > 48) { p[i + 3] = 0; continue; }
        if (spill > 22) {
          p[i + 3] = Math.round(255 * (48 - spill) / 26);
          const avg = (r + b) / 2;
          if (g > avg) p[i + 1] = Math.round(avg + (g - avg) * 0.3);
        }
      }
      ctx.putImageData(d, 0, 0);
      targets.forEach(t => {
        const tc = t.getContext('2d');
        tc.clearRect(0, 0, t.width, t.height);
        tc.drawImage(off, 0, 0, W, H, 0, 0, t.width, t.height);
      });
    };
    draw();
  };

  save = () => {
    const t = this.state.text.trim();
    if (!t) return;
    const base = location.origin + location.pathname;
    const link = `${base}#g=${btoa(encodeURIComponent(t))}`;
    this.setState({ step: 'share', saved: t, link, copied: false });
  };

  openGift = () => {
    this._timers = this._timers || [];
    this.setState({ phase: 'burst' });
    this._timers.push(setTimeout(() => this.setState({ phase: 'text' }), 320));
    this.startJazz();
  };

  componentWillUnmount() {
    (this._timers || []).forEach(clearTimeout);
    cancelAnimationFrame(this._raf);
    this.stopJazz();
  }

  // goofy jazz: swung walking bass, honking comp chords, brush hats, random slide-whistle squeals
  startJazz() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || this._playing) return;
    const ctx = this._ctx || (this._ctx = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    const master = ctx.createGain();
    master.gain.value = 0.24;
    master.connect(ctx.destination);
    this._master = master;
    this._playing = true;

    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const tone = (midi, at, dur, type, vol) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.value = mtof(midi);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(vol, at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0008, at + dur);
      o.connect(g); g.connect(master);
      o.start(at); o.stop(at + dur + 0.06);
    };
    const honk = (midi, at, dur, vol) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(mtof(midi) * 0.94, at);
      o.frequency.linearRampToValueAtTime(mtof(midi), at + 0.05);
      f.type = 'lowpass'; f.frequency.value = 1700;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(vol, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, at + dur);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(at); o.stop(at + dur + 0.05);
    };
    const squeal = at => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(880, at);
      o.frequency.exponentialRampToValueAtTime(320, at + 0.34);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.16, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0008, at + 0.36);
      o.connect(g); g.connect(master);
      o.start(at); o.stop(at + 0.4);
    };
    const hat = (at, vol) => {
      const len = 0.05, buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * len), ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7200;
      const g = ctx.createGain(); g.gain.value = vol;
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(at);
    };

    const bass = [[43, 45, 46, 48], [48, 50, 52, 53], [41, 43, 45, 46], [50, 48, 46, 45]];
    const chords = [[62, 65, 69, 72], [64, 67, 70, 74], [60, 64, 69, 71], [62, 65, 69, 72]];
    const beat = 0.34, swing = beat * 0.64;
    let bar = 0;
    let next = ctx.currentTime + 0.06;

    const schedule = () => {
      if (!this._playing) return;
      while (next < ctx.currentTime + 0.8) {
        const b = bar % 4;
        for (let i = 0; i < 4; i++) {
          const t = next + i * beat;
          tone(bass[b][i], t, beat * 0.85, 'triangle', 0.5);
          hat(t, 0.09);
          hat(t + swing, 0.2);
          if (i === 0 || i === 2) {
            const off = i === 0 ? 0 : swing * 0.4;
            chords[b].forEach(m => honk(m, t + off, beat * 0.9, 0.09));
          }
          if (i === 3 && bar % 4 === 3) tone(bass[b][i] + 12, t + swing, beat * 0.5, 'square', 0.12);
        }
        if (bar % 8 === 7) squeal(next + beat * 3.2);
        next += beat * 4;
        bar++;
      }
      this._loop = setTimeout(schedule, 180);
    };
    schedule();
  }

  stopJazz() {
    this._playing = false;
    clearTimeout(this._loop);
    if (this._master) {
      try { this._master.gain.setTargetAtTime(0, this._ctx.currentTime, 0.05); } catch (e) {}
      const m = this._master;
      setTimeout(() => { try { m.disconnect(); } catch (e) {} }, 400);
      this._master = null;
    }
  }

  renderVals() {
    const h = React.createElement;
    const cols = ['#FFE6A7', '#FF9EBE', '#A8DCD1', '#D9CBF5', '#E4658E', '#FFFFFF'];
    const burstOn = this.state.phase !== 'box';

    return {
      isForm: this.state.step === 'form',
      isShare: this.state.step === 'share',
      isGift: this.state.step === 'gift',
      boxVisible: this.state.phase === 'box',
      boxOpening: this.state.phase === 'burst',
      burst: burstOn,
      showText: this.state.phase === 'text',
      saved: this.state.saved,
      text: this.state.text,
      link: this.state.link,
      copyLabel: this.state.copied ? '복사됐다' : '링크 복사',
      catsRef: this.catsRef,
      onType: e => this.setState({ text: e.target.value }),
      onKey: e => { if (e.key === 'Enter') this.save(); },
      save: this.save,
      openGift: this.openGift,
      openPreview: () => this.setState({ step: 'gift', phase: 'box' }),
      copy: () => {
        const done = () => this.setState({ copied: true });
        if (navigator.clipboard) navigator.clipboard.writeText(this.state.link).then(done, done);
        else done();
      },
      confetti: burstOn ? cols.concat(cols, cols).map((c, i) => {
        const a = (i / 18) * Math.PI * 2 + 0.2;
        const dist = 150 + (i % 4) * 58;
        return h('span', {
          key: i,
          style: {
            position: 'absolute',
            width: i % 2 ? 13 : 9,
            height: i % 2 ? 13 : 18,
            borderRadius: i % 2 ? '50%' : 3,
            background: c,
            left: 0, top: 0,
            animation: `gb-fly ${950 + (i % 5) * 170}ms ease-out ${i * 18}ms forwards`,
            ['--tx']: `${Math.cos(a) * dist}px`,
            ['--ty']: `${Math.sin(a) * dist}px`
          }
        });
      }) : null,
      notes: burstOn ? ['♪', '♫', '♬', '♩'].map((n, i) => h('span', {
        key: i,
        style: {
          position: 'absolute',
          left: ['16%', '38%', '60%', '80%'][i],
          top: 110 + (i % 2) * 26,
          fontSize: 30 + (i % 3) * 8,
          color: '#FFFFFF',
          textShadow: '0 2px 6px rgba(0,0,0,0.35)',
          zIndex: 3,
          animation: `note-float ${1600 + i * 300}ms ease-out ${i * 380}ms infinite`
        }
      }, n)) : null
    };
  }
}

</script>
